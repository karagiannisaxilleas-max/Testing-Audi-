<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="900" viewBox="0 0 1460 900" font-family="Inter, system-ui, sans-serif">
  <defs>
    <radialGradient id="bgg" cx="80%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#10312f"/>
      <stop offset="55%" stop-color="#0b0e12"/>
    </radialGradient>
    <linearGradient id="cone" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7cd0cd" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#7cd0cd" stop-opacity="0.08"/>
    </linearGradient>
  </defs>
  <rect width="1460" height="900" fill="url(#bgg)"/>

  <!-- ============ PHONE: Welcome ============ -->
  <g transform="translate(48,70)">
    <rect width="360" height="760" rx="34" fill="#0b0e12" stroke="#2a313c" stroke-width="2"/>
    <rect x="14" y="14" width="332" height="50" rx="12" fill="#14181f"/>
    <!-- mark -->
    <g transform="translate(30,26)" stroke="#7cd0cd" stroke-width="3.4" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 11 L26 11 L15 30 Z"/>
      <path d="M10.5 11 a5.2 5.2 0 1 1 9 0"/>
    </g>
    <circle cx="40.5" cy="46" r="2.4" fill="#7cd0cd"/>
    <text x="62" y="45" fill="#7cd0cd" font-size="15" font-weight="600">vector <tspan font-weight="400">security</tspan></text>

    <!-- hero -->
    <g transform="translate(180,150)" text-anchor="middle">
      <g transform="translate(-26,0)" stroke="#7cd0cd" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round">
        <path d="M8 22 L44 22 L26 56 Z"/>
        <path d="M18 22 a8.4 8.4 0 1 1 16 0"/>
      </g>
      <circle cx="18" cy="40" r="4" fill="#7cd0cd"/>
      <text y="108" fill="#eef2f6" font-size="23" font-weight="700">CCTV Survey &amp; Quote</text>
      <text y="140" fill="#93a0ad" font-size="13">Plan coverage, prove it, and quote</text>
      <text y="158" fill="#93a0ad" font-size="13">the client before you leave site.</text>
    </g>
    <rect x="60" y="335" width="240" height="46" rx="11" fill="#7cd0cd"/>
    <text x="180" y="363" text-anchor="middle" fill="#06201f" font-size="15" font-weight="700">New survey</text>
    <rect x="60" y="391" width="240" height="44" rx="11" fill="none" stroke="#2a313c"/>
    <text x="180" y="418" text-anchor="middle" fill="#eef2f6" font-size="14">Open project</text>

    <!-- feature grid -->
    <g transform="translate(24,470)">
      <g>
        <rect width="150" height="92" rx="12" fill="#14181f" stroke="#1f242d"/>
        <text x="14" y="30" fill="#7cd0cd" font-size="18">◳</text>
        <text x="14" y="54" fill="#eef2f6" font-size="12.5" font-weight="600">Plan on site</text>
        <text x="14" y="73" fill="#93a0ad" font-size="10.5">Lay out from</text>
        <text x="14" y="86" fill="#93a0ad" font-size="10.5">your phone.</text>
      </g>
      <g transform="translate(162,0)">
        <rect width="150" height="92" rx="12" fill="#14181f" stroke="#1f242d"/>
        <text x="14" y="30" fill="#7cd0cd" font-size="18">◉</text>
        <text x="14" y="54" fill="#eef2f6" font-size="12.5" font-weight="600">Prove coverage</text>
        <text x="14" y="73" fill="#93a0ad" font-size="10.5">Catch blind</text>
        <text x="14" y="86" fill="#93a0ad" font-size="10.5">spots instantly.</text>
      </g>
      <g transform="translate(0,104)">
        <rect width="150" height="92" rx="12" fill="#14181f" stroke="#1f242d"/>
        <text x="14" y="30" fill="#7cd0cd" font-size="18">☼</text>
        <text x="14" y="54" fill="#eef2f6" font-size="12.5" font-weight="600">Day &amp; night</text>
        <text x="14" y="73" fill="#93a0ad" font-size="10.5">Model IR and</text>
        <text x="14" y="86" fill="#93a0ad" font-size="10.5">glare after dark.</text>
      </g>
      <g transform="translate(162,104)">
        <rect width="150" height="92" rx="12" fill="#14181f" stroke="#1f242d"/>
        <text x="14" y="30" fill="#7cd0cd" font-size="18">₵</text>
        <text x="14" y="54" fill="#eef2f6" font-size="12.5" font-weight="600">Quote on spot</text>
        <text x="14" y="73" fill="#93a0ad" font-size="10.5">Add margin,</text>
        <text x="14" y="86" fill="#93a0ad" font-size="10.5">send the offer.</text>
      </g>
    </g>
  </g>

  <!-- ============ DESKTOP: Survey ============ -->
  <g transform="translate(452,70)">
    <rect width="960" height="760" rx="16" fill="#0b0e12" stroke="#2a313c" stroke-width="2"/>

    <!-- header -->
    <rect x="1" y="1" width="958" height="50" rx="15" fill="#14181f"/>
    <g transform="translate(22,16)" stroke="#7cd0cd" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round">
      <path d="M4 10 L24 10 L14 28 Z"/><path d="M9.8 10 a4.8 4.8 0 1 1 8.4 0"/>
    </g>
    <circle cx="32" cy="42" r="2.2" fill="#7cd0cd"/>
    <text x="52" y="42" fill="#7cd0cd" font-size="14" font-weight="600">vector <tspan font-weight="400">security</tspan></text>

    <!-- stepper -->
    <g transform="translate(330,12)" font-size="13" font-weight="500">
      <g>
        <rect width="96" height="28" rx="14" fill="none"/>
        <circle cx="18" cy="14" r="11" fill="rgba(70,212,168,0.18)"/>
        <text x="18" y="18" text-anchor="middle" fill="#46d4a8" font-size="11" font-weight="700">✓</text>
        <text x="36" y="18" fill="#eef2f6">Setup</text>
      </g>
      <line x1="104" y1="14" x2="120" y2="14" stroke="#2a313c"/>
      <g transform="translate(128,0)">
        <rect width="104" height="28" rx="14" fill="rgba(124,208,205,0.14)" stroke="rgba(124,208,205,0.4)"/>
        <circle cx="18" cy="14" r="11" fill="#7cd0cd"/>
        <text x="18" y="18" text-anchor="middle" fill="#06201f" font-size="11" font-weight="700">2</text>
        <text x="36" y="18" fill="#7cd0cd">Survey</text>
      </g>
      <line x1="240" y1="14" x2="256" y2="14" stroke="#2a313c"/>
      <g transform="translate(264,0)">
        <circle cx="18" cy="14" r="11" fill="#222834"/>
        <text x="18" y="18" text-anchor="middle" fill="#6b7682" font-size="11" font-weight="700">3</text>
        <text x="36" y="18" fill="#6b7682">Review</text>
      </g>
      <line x1="356" y1="14" x2="372" y2="14" stroke="#2a313c"/>
      <g transform="translate(380,0)">
        <circle cx="18" cy="14" r="11" fill="#222834"/>
        <text x="18" y="18" text-anchor="middle" fill="#6b7682" font-size="11" font-weight="700">4</text>
        <text x="36" y="18" fill="#6b7682">Quote</text>
      </g>
    </g>
    <!-- header actions -->
    <g transform="translate(820,12)" font-size="12.5">
      <rect width="30" height="28" rx="8" fill="#1a1f28" stroke="#2a313c"/><text x="15" y="18" text-anchor="middle" fill="#eef2f6">m</text>
      <rect x="36" width="44" height="28" rx="8" fill="#1a1f28" stroke="#2a313c"/><text x="58" y="18" text-anchor="middle" fill="#eef2f6">Save</text>
      <rect x="86" width="48" height="28" rx="8" fill="#1a1f28" stroke="#2a313c"/><text x="110" y="18" text-anchor="middle" fill="#eef2f6">Open</text>
    </g>

    <!-- toolbar -->
    <rect x="1" y="51" width="958" height="42" fill="#14181f"/>
    <text x="22" y="77" fill="#6b7682" font-size="11" letter-spacing="1">TOOLS</text>
    <g transform="translate(72,62)" font-size="12.5">
      <rect width="58" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="29" y="17" text-anchor="middle" fill="#eef2f6">Select</text>
      <rect x="63" width="74" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="100" y="17" text-anchor="middle" fill="#eef2f6">Calibrate</text>
      <rect x="142" width="48" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="166" y="17" text-anchor="middle" fill="#eef2f6">Wall</text>
      <rect x="195" width="66" height="26" rx="7" fill="#7cd0cd"/><text x="228" y="17" text-anchor="middle" fill="#06201f" font-weight="700">Camera</text>
      <rect x="266" width="50" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="291" y="17" text-anchor="middle" fill="#eef2f6">Zone</text>
    </g>
    <g transform="translate(760,62)" font-size="12.5">
      <rect width="78" height="26" rx="7" fill="#7cd0cd"/><text x="39" y="17" text-anchor="middle" fill="#06201f" font-weight="700">Coverage</text>
      <rect x="86" width="44" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="108" y="17" text-anchor="middle" fill="#93a0ad">Undo</text>
    </g>

    <!-- canvas + side -->
    <g transform="translate(1,93)">
      <!-- canvas -->
      <rect width="710" height="666" fill="#080a0d"/>
      <!-- faint floor plan -->
      <rect x="120" y="120" width="470" height="420" fill="none" stroke="#1f3b3a" stroke-width="2"/>
      <line x1="355" y1="120" x2="355" y2="340" stroke="#e6e8ec" stroke-opacity="0.5" stroke-width="2"/>
      <!-- cones -->
      <path d="M150 150 L150 150 L380 150 L370 360 Z" fill="url(#cone)"/>
      <circle cx="380" cy="240" r="60" fill="#7cd0cd" fill-opacity="0.30"/>
      <circle cx="380" cy="240" r="34" fill="#7cd0cd" fill-opacity="0.34"/>
      <path d="M560 150 L350 175 L555 380 Z" fill="#7cd0cd" fill-opacity="0.20"/>
      <path d="M560 510 L330 360 L360 300 Z" fill="#f5b14b" fill-opacity="0.14"/>
      <!-- camera dots -->
      <circle cx="150" cy="150" r="6" fill="#7cd0cd" stroke="#0a0c10" stroke-width="2"/><text x="160" y="146" fill="#eef2f6" font-size="12">C1</text>
      <circle cx="560" cy="150" r="6" fill="#46d4a8" stroke="#0a0c10" stroke-width="2"/><text x="540" y="146" fill="#eef2f6" font-size="12">C2</text>
      <circle cx="560" cy="510" r="6" fill="#f5b14b" stroke="#0a0c10" stroke-width="2"/><text x="540" y="530" fill="#eef2f6" font-size="12">C3</text>
      <!-- status bar -->
      <rect x="0" y="636" width="710" height="30" fill="#0b0e12" fill-opacity="0.85"/>
      <text x="14" y="655" fill="#7cd0cd" font-size="11">Scale: 8.0 px/m</text>
      <text x="120" y="655" fill="#93a0ad" font-size="11">Zoom: 95%</text>
      <text x="210" y="655" fill="#93a0ad" font-size="11">Cursor: 12.4, 6.1 m</text>

      <!-- side panel -->
      <rect x="710" y="0" width="248" height="666" fill="#14181f"/>
      <text x="728" y="32" fill="#eef2f6" font-size="15" font-weight="650">Cameras</text>
      <text x="728" y="50" fill="#93a0ad" font-size="12">Place, aim and tune coverage</text>
      <!-- camera card -->
      <rect x="722" y="66" width="224" height="232" rx="12" fill="#1a1f28" stroke="#1f242d"/>
      <text x="736" y="90" fill="#6b7682" font-size="11" letter-spacing="0.8">CAMERA “C1”</text>
      <text x="736" y="118" fill="#93a0ad" font-size="11">Preset</text>
      <rect x="736" y="124" width="196" height="26" rx="7" fill="#14181f" stroke="#2a313c"/><text x="744" y="141" fill="#eef2f6" font-size="11.5">4 MP standard (4mm)</text>
      <text x="736" y="170" fill="#93a0ad" font-size="11">Heading</text><text x="916" y="170" fill="#eef2f6" font-size="11">35°</text>
      <rect x="736" y="176" width="196" height="4" rx="2" fill="#222834"/><circle cx="800" cy="178" r="6" fill="#7cd0cd"/>
      <text x="736" y="202" fill="#93a0ad" font-size="11">Focal length</text><text x="908" y="202" fill="#eef2f6" font-size="11">4.0 mm</text>
      <rect x="736" y="208" width="196" height="4" rx="2" fill="#222834"/><circle cx="772" cy="210" r="6" fill="#7cd0cd"/>
      <!-- DORI rows -->
      <g font-size="11">
        <rect x="736" y="226" width="196" height="20" rx="5" fill="#14181f"/><text x="744" y="240" fill="#eef2f6">Identify</text><text x="924" y="240" text-anchor="end" fill="#7cd0cd" font-weight="650">8.0 m</text>
        <rect x="736" y="249" width="196" height="20" rx="5" fill="#14181f"/><text x="744" y="263" fill="#eef2f6">Recognize</text><text x="924" y="263" text-anchor="end" fill="#7cd0cd" font-weight="650">16.0 m</text>
        <rect x="736" y="272" width="196" height="20" rx="5" fill="#14181f"/><text x="744" y="286" fill="#eef2f6">Detect</text><text x="924" y="286" text-anchor="end" fill="#7cd0cd" font-weight="650">80.1 m</text>
      </g>
      <!-- list -->
      <text x="728" y="328" fill="#6b7682" font-size="11" letter-spacing="0.8">CAMERAS (3)</text>
      <g font-size="12.5">
        <rect x="722" y="338" width="224" height="34" rx="8" fill="rgba(124,208,205,0.14)" stroke="rgba(124,208,205,0.4)"/>
        <rect x="734" y="351" width="12" height="12" rx="3" fill="#7cd0cd"/><text x="756" y="360" fill="#eef2f6">C1</text><text x="930" y="360" text-anchor="end" fill="#93a0ad">12 m</text>
        <rect x="734" y="382" width="12" height="12" rx="3" fill="#46d4a8"/><text x="756" y="391" fill="#eef2f6">C2</text><text x="930" y="391" text-anchor="end" fill="#93a0ad">12 m</text>
        <rect x="734" y="411" width="12" height="12" rx="3" fill="#f5b14b"/><text x="756" y="420" fill="#eef2f6">C3</text><text x="930" y="420" text-anchor="end" fill="#93a0ad">16 m</text>
      </g>
    </g>

    <!-- action bar -->
    <rect x="1" y="717" width="958" height="42" fill="#12161c"/>
    <text x="22" y="743" fill="#93a0ad" font-size="13">Calibrate the scale, trace walls, then place and aim cameras.</text>
    <rect x="760" y="725" width="58" height="26" rx="7" fill="#1a1f28" stroke="#2a313c"/><text x="789" y="742" text-anchor="middle" fill="#eef2f6" font-size="12.5">Back</text>
    <rect x="824" y="725" width="118" height="26" rx="7" fill="#7cd0cd"/><text x="883" y="742" text-anchor="middle" fill="#06201f" font-size="12.5" font-weight="700">Review coverage →</text>
  </g>
</svg>
